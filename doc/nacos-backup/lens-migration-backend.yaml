# Lens Migration Backend Service Configuration
# Namespace: lens_2026 | Group: DEFAULT_GROUP | DataId: lens-migration-backend.yaml
# Nacos config overrides application.yml defaults at runtime.
# application.yml contains datasource/security defaults so the app can start without Nacos.

spring:
  application:
    name: lens-migration-backend

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:33306}/auto_migration?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:lens}
    password: ${DB_PASSWORD:lens}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://172.28.0.1:28080}/realms/${KEYCLOAK_REALM:lens}/protocol/openid-connect/certs

# Server Configuration
server:
  port: 8061
  forward-headers-strategy: framework
  tomcat:
    redirect-context-root: false
    use-relative-redirects: true

# OpenAPI Configuration
openapi:
  service:
    title: Lens Migration API
    version: 1.0.0
    url: ${GATEWAY_URL:http://localhost:8050}/v2/lens/migration

# Springdoc Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: ${GATEWAY_URL:http://localhost:8050}/v2/lens/migration/swagger-ui/oauth2-redirect.html
    oauth:
      clientId: ${KEYCLOAK_CLIENT_ID:lens-client}
      clientSecret: ${KEYCLOAK_CLIENT_SECRET:x6lEH0DMcT27eop2cszIP3Brc2sDQHLb}
      usePkceWithAuthorizationCodeGrant: true
      scopes:
        - openid
        - profile
        - email
    disable-swagger-default-url: true

# Keycloak Configuration
keycloak:
  url: ${KEYCLOAK_URL:http://172.28.0.1:28080}
  realm: ${KEYCLOAK_REALM:lens}

# Migration Service Configuration
migration:
  python:
    executable: ${PYTHON_EXECUTABLE:python3}
    venv-path: ${PYTHON_VENV:/home/zhenac/my/lens_2026/migration/lens-migration-core/venv}
  storage:
    base-path: ${STORAGE_PATH:/var/lens/migration}
    yang-dir: ${STORAGE_PATH:/var/lens/migration}/yang
    xml-dir: ${STORAGE_PATH:/var/lens/migration}/xml
    xslt-dir: ${STORAGE_PATH:/var/lens/migration}/xslt
    test-dir: ${STORAGE_PATH:/var/lens/migration}/tests
  ai:
    provider: ${AI_PROVIDER:github}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o}
    max-tokens: ${AI_MAX_TOKENS:4000}
    temperature: ${AI_TEMPERATURE:0.3}

# MyBatis-Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lens: ${LOG_LEVEL_LENS:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
