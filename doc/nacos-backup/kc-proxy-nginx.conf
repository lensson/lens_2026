worker_processes  1;
error_log  /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # map cookie values to kc_session variable
    map $cookie_AUTH_SESSION_ID_LEGACY $kc_session {
        default $cookie_AUTH_SESSION_ID_LEGACY;
        ""      "";
    }
    map $kc_session $kc_session2 {
        default $kc_session;
        ""      $cookie_AUTH_SESSION_ID;
    }
    map $kc_session2 $kc_final {
        default $kc_session2;
        ""      $cookie_KC_RESTART;
    }
    server {
        listen 80;
        server_name _;
        location / {
            proxy_pass http://lens-keycloak-new:8080;
            # Forward the original Host (including port) so Keycloak builds correct URLs
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header Set-Cookie;
            proxy_pass_header Set-Cookie;
            add_header "X-KC-Session" "$kc_final" always;
            if ($kc_final != "") {
                add_header Set-Cookie "KEYCLOAK_SESSION=$kc_final; Path=/realms/lens/; SameSite=Lax" always;
            }
        }
    }
}
