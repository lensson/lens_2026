server {
    listen 8060;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Gateway
    # When running the frontend inside Docker, resolve the host machine
    # as `host.docker.internal`. On many Docker versions you can map that
    # name to the host gateway by running the container with:
    #   --add-host=host.docker.internal:host-gateway
    # or use the host network on Linux:
    #   --network host
    # The proxy target below points to the host's gateway listening on 8050.
    location /v2/lens/migration/api/ {
        proxy_pass http://host.docker.internal:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

