# Generated nginx config for local frontend + proxy to gateway
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  # SPA support: try files, otherwise serve index.html so client-side routing works
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Proxy backend API requests to gateway on host
  location /v2/ {
    proxy_pass http://host.docker.internal:8050;
    # preserve original Host header including port so gateway builds correct redirect_uri
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 120s;
  }
  # OAuth callback endpoints that must reach gateway
  location /login/oauth2/ {
    proxy_pass http://host.docker.internal:8050;
    # preserve original Host header including port so gateway builds correct redirect_uri
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  # Optional: forward any /auth/ or other gateway paths as needed
}
